# ansible.cfg — Project-level Ansible configuration
# Stored in GitHub repo: scm-ansible-demo/ansible.cfg

[defaults]
inventory         = hosts.ini      # default inventory file
host_key_checking = False           # no SSH key prompts needed for localhost
connection        = local           # run all tasks locally, no SSH

# CONCURRENCY: forks controls parallel task execution across hosts
forks             = 2

[privilege_escalation]
become            = false           # no sudo needed for localhost demo
